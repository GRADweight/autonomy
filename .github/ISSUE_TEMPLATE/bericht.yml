name: "Fehlerbericht"
description: "Validator, Baustein oder Beispiel verhält sich nicht wie dokumentiert"
title: "[fehler] "
labels: ["bug"]
body:
  - type: textarea
    id: was
    attributes:
      label: "Was ist passiert?"
      description: "Erwartetes und tatsächliches Verhalten."
    validations:
      required: true
  - type: textarea
    id: reproduktion
    attributes:
      label: "Reproduktion"
      description: "Befehl, Eingabedatei (ohne echte Daten) und Ausgabe."
      render: shell
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: "Version"
      description: "Ausgabe von `gw-autonomy --version` und Python-Version."
    validations:
      required: true
