name: "Doku- oder Quellenkorrektur"
description: "Eine Aussage zu Gesetz, Norm oder Verhalten ist veraltet oder falsch"
title: "[doku] "
labels: ["documentation"]
body:
  - type: input
    id: datei
    attributes:
      label: "Datei und Abschnitt"
      placeholder: "docs/regulatorik.md, Abschnitt EU AI Act"
    validations:
      required: true
  - type: textarea
    id: korrektur
    attributes:
      label: "Bisherige und korrekte Aussage"
    validations:
      required: true
  - type: input
    id: quelle
    attributes:
      label: "Quelle"
      description: "Erlass oder Norm mit Artikel und Stand, möglichst Primärquelle (URL)."
    validations:
      required: true
