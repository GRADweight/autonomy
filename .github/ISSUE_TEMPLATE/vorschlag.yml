name: "Vorschlag"
description: "Neue Regel, neuer Baustein oder neues Beispiel"
title: "[vorschlag] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: "Welches Problem löst der Vorschlag?"
      description: "Konkrete Situation und Folge, nicht «man könnte»."
    validations:
      required: true
  - type: textarea
    id: beispiel
    attributes:
      label: "Minimalbeispiel"
      description: "Use-Case-JSON, Test oder Pseudocode."
    validations:
      required: false
  - type: textarea
    id: grenzen
    attributes:
      label: "Was der Vorschlag nicht leistet"
    validations:
      required: false
