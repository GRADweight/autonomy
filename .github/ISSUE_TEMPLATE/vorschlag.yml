name: "Vorschlag"
about: "Einen neuen Fall oder ein neues Feature vorschlagen"
title: "[vorschlag] "
labels: ["neuer-vorschlag"]
body:
  - type: textarea
    attributes:
      label: "Was ist die Idee?"
      description: "Ein Satz. Was soll es geben, was es heute nicht gibt?"
    required: true
  - type: textarea
    attributes:
      label: "Welches Problem löst es?"
      description: "Nicht 'wir könnten', sondern: wenn <Zustand>, dann <Folge>."
    required: true
  - type: textarea
    attributes:
      label: "Minimalfall (konkretes Beispiel)"
      description: "JSON, Test oder Skript — je konkreter, desto besser."
    required: false
  - type: textarea
    attributes:
      label: "Was es NICHT ist"
      description: "1–2 Sätze Grenzen, z.B. 'ersetzt keine Rollen-Policy'."
    required: false
