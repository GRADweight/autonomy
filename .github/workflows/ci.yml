name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_PYTHON_DOWNLOADS: automatic

jobs:
  lint:
    name: Lint (ruff, mypy --strict)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: false
      - name: Abhängigkeiten
        run: uv sync --python 3.12
      - name: ruff check
        run: uv run --no-sync ruff check .
      - name: ruff format --check
        run: uv run --no-sync ruff format --check .
      - name: mypy --strict
        run: uv run --no-sync mypy

  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: false
      - name: Abhängigkeiten
        run: uv sync --python ${{ matrix.python-version }}
      - name: OASIS-SARIF-Schema laden (fester Commit, SHA-256 geprüft)
        run: |
          curl -sSfL -o /tmp/sarif-schema-2.1.0.json \
            https://raw.githubusercontent.com/oasis-tcs/sarif-spec/1742a253eb654bf8a4ed7c60eaef7412b2c23553/sarif-2.1/schema/sarif-schema-2.1.0.json
          echo "c3b4bb2d6093897483348925aaa73af03b3e3f4bd4ca38cef26dcb4212a2682e  /tmp/sarif-schema-2.1.0.json" | sha256sum -c -
      - name: pytest mit Coverage (Schwelle 90 %)
        env:
          GW_SARIF_SCHEMA: /tmp/sarif-schema-2.1.0.json
        run: uv run --no-sync pytest --cov --cov-report=term-missing

  package:
    name: Paket bauen und frisch installieren
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Wheel und sdist bauen
        run: |
          python -m pip install --upgrade build
          python -m build --outdir dist
      - name: Wheel in frischem venv installieren (ohne Repo im Pfad)
        run: |
          python -m venv /tmp/wheel-venv
          /tmp/wheel-venv/bin/pip install dist/*.whl
          cd /tmp
          /tmp/wheel-venv/bin/python -c "import gradweight_autonomy as g; print(g.__version__)"
          /tmp/wheel-venv/bin/python -c "import importlib.resources as r; assert r.files('gradweight_autonomy').joinpath('py.typed').is_file()"
      - name: CLI-Smoke-Test mit installiertem Wheel
        run: |
          cd /tmp
          /tmp/wheel-venv/bin/gw-autonomy --version
          /tmp/wheel-venv/bin/gw-autonomy schema > /tmp/schema.json
          /tmp/wheel-venv/bin/python -c "import json; json.load(open('/tmp/schema.json'))"
          /tmp/wheel-venv/bin/gw-autonomy rules
          /tmp/wheel-venv/bin/gw-autonomy validate --check-evidence "$GITHUB_WORKSPACE/examples"
          if /tmp/wheel-venv/bin/gw-autonomy validate "$GITHUB_WORKSPACE/examples/negativ"; then
            echo "Negativbeispiele müssen scheitern" >&2
            exit 1
          fi
      - name: sdist in frischem venv installieren
        run: |
          python -m venv /tmp/sdist-venv
          /tmp/sdist-venv/bin/pip install dist/*.tar.gz
          cd /tmp
          /tmp/sdist-venv/bin/python -c "import gradweight_autonomy"
      - name: Schnellstart aus dem README wörtlich ausführen
        run: |
          python - > /tmp/quickstart.sh <<'PY'
          import re, pathlib
          text = pathlib.Path("README.md").read_text(encoding="utf-8")
          block = re.search(r"<!-- quickstart:start -->\n```bash\n(.*?)\n```", text, re.S).group(1)
          print("\n".join(l for l in block.splitlines() if not l.startswith(("git clone", "cd autonomy"))))
          PY
          cat /tmp/quickstart.sh
          git archive --format=tar --prefix=quickstart/ HEAD | tar -x -C /tmp
          cd /tmp/quickstart
          bash -euo pipefail /tmp/quickstart.sh

  security:
    name: Security (gitleaks, pip-audit)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: gitleaks installieren (Binary, SHA-256 geprüft)
        run: |
          curl -sSfL -o /tmp/gitleaks.tar.gz \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  /tmp/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
      - name: gitleaks (Historie und Arbeitsverzeichnis)
        run: |
          /tmp/gitleaks git . --redact --no-banner
          /tmp/gitleaks dir . --redact --no-banner
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: false
      - name: pip-audit (Entwicklungsumgebung inkl. aller Werkzeuge)
        run: |
          uv sync --python 3.12
          uv pip freeze --exclude-editable > /tmp/requirements-audit.txt
          uvx pip-audit --strict --disable-pip --no-deps -r /tmp/requirements-audit.txt
