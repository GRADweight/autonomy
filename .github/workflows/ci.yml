name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e packages/gradbuild -e packages/gw_core pytest
      - name: Tests (gradbuild + gw_core)
        run: python -m pytest tests_gradbuild tests_gwcore -v
      - name: Governance-Checks (Deckel, Injection, Log)
        run: python3 governance/checks/governance_check.py
      - name: Validate all examples
        run: |
          for f in examples/gw*.json; do
            python -m gradbuild.cli "$f"
          done
      - name: Counter-example must fail
        run: |
          if python -m gradbuild.cli examples/counterexample.json 2>/dev/null; then
            echo "FAIL: counterexample.json sollte abgelehnt werden"
            exit 1
          else
            echo "OK: counterexample.json wird korrekt abgelehnt"
          fi
