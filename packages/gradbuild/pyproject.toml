[project]
name = "gradbuild"
version = "0.2.0"
description = "Autonomiegrade für KI in KMU-Prozessen: Modell, Regeln (GB-01…GB-16) und Validator — zero-deps."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "GRADweight GmbH", email = "mail@gradweight.ch" }]
keywords = ["ai-governance", "autonomy", "agents", "kmu", "audit"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Intended Audience :: Information Technology",
  "Programming Language :: Python :: 3",
  "Topic :: Security",
  "Topic :: Software Development :: Libraries :: Application Frameworks",
]
# Zero dependencies — bewusst.
dependencies = []

[project.urls]
Homepage = "https://github.com/GRADweight/autonomy"
Issues = "https://github.com/GRADweight/autonomy/issues"

[project.scripts]
gradbuild = "gradbuild.cli:main"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["gradbuild*"]

[tool.uv]
# bewusst keine zusätzlichen Abhängigkeiten — `uv venv && uv pip install -e .` reicht.
