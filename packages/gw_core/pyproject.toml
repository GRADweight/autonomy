[project]
name = "gw-core"
version = "0.1.0"
description = "GRADweight Governance-Bausteine: Approval-Queue, Audit-Trail, Zahlen- und Quellenabgleich, AuthZ, Tracing, Zielsystem-Adapter. Null Abhaengigkeiten ausser httpx (bexio)."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "GRADweight GmbH", email = "mail@gradweight.ch" }]
dependencies = ["httpx>=0.24"]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["gw_core*"]
