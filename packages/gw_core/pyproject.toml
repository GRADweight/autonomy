[project]
name = "gw-core"
version = "0.1.0"
description = "GRADweight Governance-Bausteine: Approval-Queue, Audit-Trail, Zweitmodell-Pruefung, AuthZ, Tracing, Zielsystem-Adapter. Null Abhaengigkeiten ausser httpx (bexio)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "GRADweight" }]
dependencies = ["httpx>=0.24"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["gw_core*"]
