[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "gradweight-autonomy"
version = "2.0.0"
description = "Autonomiegrade für KI in KMU-Prozessen: Policy-as-Code-Validator (GB-Regeln, SARIF) und Governance-Bausteine."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "GRADweight GmbH", email = "mail@gradweight.ch" }]
keywords = ["ai-governance", "policy-as-code", "sarif", "audit-trail", "qr-bill", "kmu"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Intended Audience :: Information Technology",
  "Natural Language :: German",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Security",
  "Topic :: Office/Business :: Financial :: Accounting",
  "Typing :: Typed",
]
# Bewusst keine Laufzeit-Abhängigkeiten: alles läuft mit der Standardbibliothek.
dependencies = []

[project.urls]
Homepage = "https://github.com/GRADweight/autonomy"
Issues = "https://github.com/GRADweight/autonomy/issues"
Changelog = "https://github.com/GRADweight/autonomy/blob/main/CHANGELOG.md"

[project.scripts]
gw-autonomy = "gradweight_autonomy.cli:main"

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-cov>=6.0",
  "hypothesis>=6.120",
  "jsonschema>=4.23",
  "python-stdnum>=2.0",
  "mypy>=1.14",
  "ruff>=0.9",
  "build>=1.2",
]

[tool.hatch.build.targets.wheel]
packages = ["src/gradweight_autonomy"]

[tool.hatch.build.targets.sdist]
include = [
  "src",
  "tests",
  "examples",
  "docs",
  "README.md",
  "CHANGELOG.md",
  "LICENSE",
  "pyproject.toml",
]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
  "E", "W", "F", "I", "B", "UP", "SIM", "RUF", "S", "C4", "PT", "RET", "PTH",
  "N", "ARG", "PIE", "T20", "TRY", "PL", "BLE", "DTZ", "ISC", "PGH",
]
ignore = [
  "PLR0911",  # viele Rückgabepunkte sind in Prüffunktionen lesbarer als verschachtelte Logik
  "PLR0912",
  "PLR0913",
  "PLR2004",  # Fachkonstanten (Längen, Grade) stehen bewusst im Prüfcode
  "TRY003",   # sprechende Fehlermeldungen direkt am raise
]
allowed-confusables = ["–", "’", "«", "»", "×"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S108", "PLR0915", "ARG001", "T20"]
"src/gradweight_autonomy/cli.py" = ["T20"]
"src/gradweight_autonomy/demo.py" = ["T20"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
strict = true
python_version = "3.10"
files = ["src/gradweight_autonomy"]
warn_unreachable = true

[tool.pytest.ini_options]
testpaths = ["tests", "src"]
addopts = ["-ra", "--strict-markers", "--strict-config", "--doctest-modules"]
filterwarnings = [
  "error",
  # Tests verlassen sich für kurzlebige :memory:-Datenbanken teils auf die Garbage Collection;
  # die Bausteine bieten close() und Kontextmanager (siehe test_context_manager_closes).
  "ignore:unclosed database:ResourceWarning",
]

[tool.coverage.run]
source = ["gradweight_autonomy"]
branch = true

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = true
exclude_also = [
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
  "if __name__ == .__main__.:",
]
